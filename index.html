<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermercado · Alimentos frescos</title>
  <!-- Bootstrap 5 (boomstrap 5) justo para maquetación limpia, respetando el diseño exacto de la imagen -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* RESET absolutamente fiel a la imagen: tipografía por defecto del sistema (sin google fonts) tal como se ve en la foto */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #e6e2da;  /* fondo cálido gris-beige, igual al de la imagen */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* contenedor principal: dimensiones y forma idénticas al recorte */
    .papel-frontera {
      max-width: 780px;
      width: 100%;
      background-color: white;
      border-radius: 45px 45px 40px 40px;  /* justo el radio de la imagen */
      overflow: hidden;
      box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.2);
      border: 1px solid #d6c9bc;
    }

    /* CABECERA: fondo melocotón exacto como en la imagen (#f8d9cf) */
    .cabecera-alimentos {
      background-color: #f8d9cf;   /* color idéntico al fondo de SUPERMERCADO */
      padding: 2.3rem 2.2rem 2rem 2.2rem;
      border-bottom: 3px solid #e0b9a8;
    }

    /* SUPERMERCADO en mayúsculas, grueso, con espaciado preciso */
    .super-titulo {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.5px;
      color: #1c1c1c;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    /* línea decorativa naranja (más corta, como en la imagen) */
    .raya-naranja {
      width: 90px;
      height: 7px;
      background-color: #d34f27;    /* naranja quemado exacto */
      border-radius: 8px;
      margin: 12px 0 18px 0;
    }

    /* estilo de los ítems con bullet (punto) - replicando viñeta cuadrada? No, en imagen es un círculo perfecto */
    .item-bullet {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }
    .bullet {
      width: 18px;
      height: 18px;
      background-color: #d34f27;    /* mismo naranja */
      border-radius: 50%;
      flex-shrink: 0;
      /* en la imagen se ve ligeramente más pequeño, pero es proporcional */
    }
    .texto-bullet {
      font-size: 2.2rem;
      font-weight: 600;
      color: #1e1e1e;
      line-height: 1.1;
      text-transform: lowercase;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: -0.3px;
    }
    .texto-bullet::first-letter {
      text-transform: uppercase;
      font-weight: 700;
    }

    /* SEGUNDA SECCIÓN (fondo gris claro como en la foto) */
    .seccion-carteles {
      background-color: #f1efeb;   /* gris-beige clarísimo, idéntico al de la imagen */
      padding: 2.2rem 2.2rem 2.8rem 2.2rem;
      border-top: 2px solid #dacfc4;
    }

    /* "Carteles de la página web" en minúsculas? No, en imagen es oración con mayúsculas solo iniciales */
    .carteles-titulo {
      font-size: 1.9rem;
      font-weight: 650;
      color: #26211c;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      letter-spacing: -0.2px;
    }

    /* "CARTELERÍA DE LA PÁGINA WEB FRONTERA" tal cual, todo en mayúsculas y con su tipografía */
    .carteles-subtitulo {
      font-size: 1.45rem;
      font-weight: 600;
      color: #3b2f26;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      word-spacing: 2px;
      margin-bottom: 1.8rem;
      border-left: 7px solid #d34f27;   /* barra naranja izquierda como en el diseño */
      padding-left: 1.1rem;
      background-color: #f1efeb;        /* mismo fondo para que parezca una línea naranja pegada */
      display: inline-block;
    }

    /* Contenedor de los cartelitos (rectángulos grises con texto) */
    .cartel-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 14px;
      margin-top: 0.5rem;
      margin-bottom: 2.2rem;
    }

    /* cada cartel es un rectángulo redondeado, gris claro, con texto en negrita */
    .cartel-item {
      background-color: #eae5de;      /* gris con tono crema, igual a los carteles de la imagen */
      border-radius: 40px;             /* muy redondeado pero no exagerado */
      padding: 0.6rem 2rem 0.6rem 2rem;
      display: inline-block;
      font-size: 1.35rem;
      font-weight: 650;
      color: #252016;
      border: 1px solid #cbbcac;
      letter-spacing: -0.2px;
      box-shadow: 0 2px 3px rgba(0,0,0,0.02);
      text-transform: uppercase;        /* tal cual en la imagen: OFERTA LIMÓN, VERDURAS, etc van en mayúsculas */
    }

    /* fila adicional de carteles (segunda tanda) exacta a la imagen: SUPER OFERTA, 2X1 CÍTRICOS, HUEVOS CAMPESTRES */
    .carteles-secundarios {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 18px;
      margin: 0.5rem 0 1.8rem 0;
    }
    .cartel-sec {
      background-color: #eae5de;
      border-radius: 40px;
      padding: 0.7rem 2.2rem 0.7rem 2.2rem;
      font-size: 1.4rem;
      font-weight: 650;
      color: #23201a;
      border: 1px solid #cbbcac;
      text-transform: uppercase;
    }

    /* texto de nota al pie: "más carteles en la web · actualizado 2026" con su puntito */
    .nota-pie {
      font-size: 1.1rem;
      color: #6b5d50;
      margin-top: 2rem;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: transparent;
      font-weight: 400;
    }
    .nota-pie i {
      color: #d34f27;
      font-size: 1.8rem;
      font-style: normal;
      line-height: 0;
    }
    .punto-naranja {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #d34f27;
      border-radius: 50%;
      margin-right: 8px;
    }

    /* RESPONSIVE: que no se rompa en móvil */
    @media (max-width: 600px) {
      .super-titulo { font-size: 3.2rem; }
      .texto-bullet { font-size: 1.8rem; }
      .carteles-titulo { font-size: 1.6rem; }
      .carteles-subtitulo { font-size: 1.2rem; }
      .cartel-item { font-size: 1.1rem; padding: 0.5rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="papel-frontera">

    <!-- CABECERA: SUPERMERCADO + para alimentos / frescos -->
    <div class="cabecera-alimentos">
      <div class="super-titulo">SUPERMERCADO</div>
      <!-- raya naranja exacta -->
      <div class="raya-naranja"></div>

      <!-- ítem: para alimentos -->
      <div class="item-bullet">
        <span class="bullet"></span>
        <span class="texto-bullet">para alimentos</span>
      </div>

      <!-- ítem: frescos (mismo estilo) -->
      <div class="item-bullet">
        <span class="bullet"></span>
        <span class="texto-bullet">frescos</span>
      </div>
    </div>

    <!-- SECCIÓN INFERIOR: carteles -->
    <div class="seccion-carteles">
      <!-- primera línea: Carteles de la página web -->
      <div class="carteles-titulo">Carteles de la página web</div>
      <!-- segunda línea: CARTELERÍA DE LA PÁGINA WEB FRONTERA (con barra naranja) -->
      <div class="carteles-subtitulo">CARTELERÍA DE LA PÁGINA WEB FRONTERA</div>

      <!-- GRUPO 1 DE CARTELES (tal como aparece en la imagen: oferta limón, verduras, fruta del día, hortalizas, pan recién horneado, carnes, pescados, lácteos) -->
      <div class="cartel-grid">
        <span class="cartel-item">OFERTA LIMÓN</span>
        <span class="cartel-item">VERDURAS</span>
        <span class="cartel-item">FRUTA DEL DÍA</span>
        <span class="cartel-item">HORTALIZAS</span>
        <span class="cartel-item">PAN RECIÉN HORNEADO</span>
        <span class="cartel-item">CARNES</span>
        <span class="cartel-item">PESCADOS</span>
        <span class="cartel-item">LÁCTEOS</span>
      </div>

      <!-- SEGUNDO GRUPO: los tres carteles adicionales que se ven: SUPER OFERTA, 2X1 CÍTRICOS, HUEVOS CAMPESTRES (con el mismo estilo) -->
      <div class="carteles-secundarios">
        <span class="cartel-sec">SUPER OFERTA</span>
        <span class="cartel-sec">2X1 CÍTRICOS</span>
        <span class="cartel-sec">HUEVOS CAMPESTRES</span>
      </div>

      <!-- PIE con punto y texto actualizado (exactamente como en la imagen: un punto naranja y "más carteles en la web · actualizado 2026") -->
      <div class="nota-pie">
        <span class="punto-naranja"></span>
        <span>más carteles en la web · actualizado 2026</span>
      </div>
    </div>
  </div>

  <!-- sin bootstrap js ni nada extra, solo maqueta fiel -->
</body>
</html>
